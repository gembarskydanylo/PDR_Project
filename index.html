<!DOCTYPE html>
<html lang="uk" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F2F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="ПДР Бельгії — підготовка до теоретичного іспиту на категорію B">
  <title>ПДР Бельгії</title>
  <link rel="canonical" href="https://gembarskydanylo.github.io/PDR_Project/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ПДР Бельгії">
  <meta property="og:title" content="ПДР Бельгії — теорія категорії B українською">
  <meta property="og:description" content="Безкоштовний тренажер до теоретичного іспиту в Бельгії: справжні знаки, схеми ситуацій, пояснення з посиланнями на Wegcode. UK · NL · FR · EN.">
  <meta property="og:url" content="https://gembarskydanylo.github.io/PDR_Project/">
  <meta property="og:image" content="https://gembarskydanylo.github.io/PDR_Project/assets/banners/launch/minimal-og-1200x630.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ПДР Бельгії: Готуйся до теорії українською. 50 питань, 15 секунд на відповідь, 41 з 50 щоб скласти.">
  <meta property="og:locale" content="uk_UA">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" hidden></button>
    <div class="brand" id="brand">
      <img src="assets/signs/B9.svg" alt="" width="28" height="28">
      <span id="appTitle">ПДР Бельгії</span>
    </div>
    <div class="quiz-progress" id="quizProgress" hidden>
      <span id="prog"></span>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
    </div>
    <select id="uiLangPicker" class="lang-select" aria-label="Language">
      <option value="uk">UK</option>
      <option value="nl">NL</option>
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>
    <button class="icon-btn" id="settingsBtn" type="button"></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Menu"></nav>

  <script src="js/translations.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
